<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5eedf" />
    <title>鸡兔同笼 - Math Motion Lab</title>
    <link rel="stylesheet" href="styles.css?v=20260715-2" />
  </head>
  <body class="cr-body">
    <a class="cr-skip-link" href="#lesson-stage">跳到讲题舞台</a>
    <main class="cr-classroom" data-chicken-rabbit-app>
      <header class="cr-appbar">
        <div class="cr-title-group">
          <a class="cr-icon-button cr-back-link" href="../../index.html" data-action="back" aria-label="返回课程目录">←</a>
          <div>
            <p class="cr-eyebrow" data-copy="labName">小学数学互动课堂</p>
            <h1 data-copy="title">鸡兔同笼</h1>
          </div>
        </div>
        <div class="cr-toolbar">
          <button class="cr-toolbar-button" type="button" data-action="edit">
            <span aria-hidden="true">✎</span>
            <span data-copy="edit">编辑题目</span>
          </button>
          <button class="cr-toolbar-button" type="button" data-action="fullscreen">
            <span aria-hidden="true">⛶</span>
            <span data-copy="fullscreen">全屏讲解</span>
          </button>
          <button class="cr-toolbar-button cr-language-button" type="button" data-language-toggle>EN</button>
        </div>
      </header>

      <section class="cr-problem-strip" aria-label="当前题目">
        <span class="cr-fact is-heads"><span aria-hidden="true">●</span> <strong data-heads-summary>8</strong> <span data-copy="headsUnit">个头</span></span>
        <span class="cr-fact is-legs"><span aria-hidden="true">Ⅱ</span> <strong data-legs-summary>22</strong> <span data-copy="legsUnit">条腿</span></span>
        <strong class="cr-problem-question" data-copy="problemQuestion">鸡和兔各有多少只？</strong>
      </section>

      <nav class="cr-progress" aria-label="讲解进度" data-progress></nav>

      <section class="cr-workspace">
        <section id="lesson-stage" class="cr-stage" data-stage aria-live="polite"></section>
        <aside class="cr-board" data-board aria-live="polite"></aside>
      </section>

      <footer class="cr-console">
        <button class="cr-nav-button" type="button" data-action="prev">← <span data-copy="prev">上一页</span></button>
        <span class="cr-page-count" data-page-count>第 1 页 / 共 8 页</span>
        <button class="cr-nav-button is-primary" type="button" data-action="next"><span data-next-label>下一页</span> →</button>
      </footer>

      <dialog class="cr-settings-dialog" data-settings-dialog>
        <form class="cr-settings-form" method="dialog" novalidate>
          <header class="cr-dialog-head">
            <div>
              <p class="cr-eyebrow" data-copy="parameters">题目参数</p>
              <h2 data-copy="settingsTitle">编辑鸡兔同笼</h2>
              <p data-copy="settingsLead">数量不设上限，应用后会从第 1 页重新讲解。</p>
            </div>
            <button class="cr-icon-button" type="button" data-action="close-settings" aria-label="关闭">×</button>
          </header>

          <label class="cr-field">
            <span data-copy="headsLabel">头的总数</span>
            <input name="heads" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" value="8" data-setting="heads" />
          </label>
          <label class="cr-field">
            <span data-copy="legsLabel">腿的总数</span>
            <input name="legs" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" value="22" data-setting="legs" />
          </label>

          <section class="cr-validity-note">
            <strong data-copy="validityTitle">有效题目需要满足</strong>
            <ul>
              <li data-copy="validityPositive">头数和腿数都是正整数</li>
              <li data-copy="validityEven">腿数是偶数</li>
              <li data-copy="validityRange">腿数不少于头数×2，不多于头数×4</li>
            </ul>
          </section>

          <p class="cr-dialog-error" data-settings-error role="alert" hidden></p>
          <div class="cr-dialog-actions">
            <button class="cr-dialog-button" type="button" data-action="cancel-settings" data-copy="cancel">取消</button>
            <button class="cr-dialog-button is-primary" type="button" data-action="apply-settings" data-copy="apply">应用并重新讲解</button>
          </div>
        </form>
      </dialog>
    </main>

    <script src="../../assets/lab-data.js?v=20260712-1"></script>
    <script src="../../assets/lab-models.js?v=20260712-1"></script>
    <script src="../../assets/lab-core.js"></script>
    <script src="lesson.js?v=20260712-1"></script>
  </body>
</html>
