<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4efe3" />
    <title>乘积末尾的0 - Math Motion Lab</title>
    <link rel="stylesheet" href="styles.css?v=20260715-2" />
  </head>
  <body class="tz-body">
    <a class="tz-skip-link" href="#lesson-stage">跳到讲题舞台</a>
    <main class="tz-classroom" data-trailing-zeros-app>
      <header class="tz-appbar">
        <div class="tz-title-group">
          <a class="tz-icon-button tz-back-link" href="../../index.html" data-action="back" aria-label="返回课程目录">←</a>
          <div>
            <p class="tz-eyebrow" data-copy="labName">小学数学互动课堂</p>
            <h1 data-copy="title">乘积末尾的0</h1>
          </div>
        </div>
        <div class="tz-toolbar">
          <button class="tz-toolbar-button" type="button" data-action="edit">
            <span aria-hidden="true">✎</span>
            <span data-copy="edit">修改题目</span>
          </button>
          <button class="tz-toolbar-button" type="button" data-action="fullscreen">
            <span aria-hidden="true">⛶</span>
            <span data-copy="fullscreen">全屏讲解</span>
          </button>
          <button class="tz-toolbar-button tz-language-button" type="button" data-language-toggle>EN</button>
        </div>
      </header>

      <section class="tz-problem-strip" aria-label="当前题目">
        <strong class="tz-problem-expression">
          <span data-multiplicand-summary>45</span>
          <span aria-hidden="true">×</span>
          <svg class="tz-star-icon is-small" viewBox="0 0 64 64" role="img" aria-label="未知正整数">
            <path d="M32 5.5 39.9 22l18.1 2.6-13 12.8 3.1 18-16.1-8.5-16.1 8.5 3.1-18L6 24.6 24.1 22Z" />
            <text x="32" y="39">?</text>
          </svg>
        </strong>
        <span class="tz-positive-note" data-copy="positiveNote">星形图标表示正整数</span>
        <strong class="tz-problem-question"><span data-copy="problemPrefix">积的末尾至少有</span> <span data-target-summary>2</span> <span data-copy="zeroUnit">个0，最小是多少？</span></strong>
      </section>

      <nav class="tz-progress" aria-label="讲解进度" data-progress></nav>

      <section class="tz-workspace">
        <section id="lesson-stage" class="tz-stage" data-stage aria-live="polite"></section>
        <aside class="tz-board" data-board aria-live="polite"></aside>
      </section>

      <footer class="tz-console">
        <button class="tz-nav-button" type="button" data-action="prev">← <span data-copy="prev">上一页</span></button>
        <span class="tz-page-count" data-page-count>第 1 页</span>
        <button class="tz-nav-button is-primary" type="button" data-action="next"><span data-next-label>下一页</span> →</button>
      </footer>

      <dialog class="tz-settings-dialog" data-settings-dialog>
        <form class="tz-settings-form" method="dialog" novalidate>
          <header class="tz-dialog-head">
            <div>
              <p class="tz-eyebrow" data-copy="parameters">题目参数</p>
              <h2 data-copy="settingsTitle">换一道题试一试</h2>
              <p data-copy="settingsLead">应用后会从第1页开始，逐个锁定需要的0。</p>
            </div>
            <button class="tz-icon-button" type="button" data-action="close-settings" aria-label="关闭">×</button>
          </header>

          <label class="tz-field">
            <span data-copy="multiplicandLabel">被乘数（1～1000）</span>
            <input name="multiplicand" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" value="45" data-setting="multiplicand" />
          </label>
          <label class="tz-field">
            <span data-copy="targetZerosLabel">目标0的个数（1～1000）</span>
            <input name="targetZeros" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" value="2" data-setting="targetZeros" />
          </label>

          <section class="tz-method-note">
            <strong data-copy="methodTitle">页面会怎样重新讲解？</strong>
            <p data-copy="methodCopy">每一轮只看正在处理的数的个位，找到最小的乘数，得到一个0后把它锁定。</p>
          </section>

          <p class="tz-dialog-error" data-settings-error role="alert" hidden></p>
          <div class="tz-dialog-actions">
            <button class="tz-dialog-button" type="button" data-action="cancel-settings" data-copy="cancel">取消</button>
            <button class="tz-dialog-button is-primary" type="button" data-action="apply-settings" data-copy="apply">应用并重新讲解</button>
          </div>
        </form>
      </dialog>
    </main>

    <script src="../../assets/lab-data.js?v=20260713-1"></script>
    <script src="../../assets/lab-models.js?v=20260713-1"></script>
    <script src="../../assets/lab-core.js"></script>
    <script src="lesson.js?v=20260713-1"></script>
  </body>
</html>
