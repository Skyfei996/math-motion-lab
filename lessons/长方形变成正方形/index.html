<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4efe3" />
    <title>长方形变成正方形 - Math Motion Lab</title>
    <link rel="stylesheet" href="styles.css?v=20260714-2" />
  </head>
  <body class="rs-body">
    <a class="rs-skip-link" href="#lesson-stage">跳到讲题舞台</a>
    <main class="rs-classroom" data-rectangle-square-app>
      <header class="rs-appbar">
        <div class="rs-title-group">
          <a class="rs-icon-button rs-back-link" href="../../index.html" data-action="back" aria-label="返回课程目录">←</a>
          <div>
            <p class="rs-eyebrow" data-copy="labName">小学数学互动课堂</p>
            <h1 data-copy="title">长方形变成正方形</h1>
          </div>
        </div>
        <div class="rs-toolbar">
          <button class="rs-toolbar-button" type="button" data-action="edit">
            <span aria-hidden="true">✎</span>
            <span data-copy="edit">修改题目</span>
          </button>
          <button class="rs-toolbar-button" type="button" data-action="fullscreen">
            <span aria-hidden="true">⛶</span>
            <span data-copy="fullscreen">全屏讲解</span>
          </button>
          <button class="rs-toolbar-button rs-language-button" type="button" data-language-toggle>EN</button>
        </div>
      </header>

      <section class="rs-problem-strip" aria-label="当前题目" data-problem-strip></section>
      <nav class="rs-progress" aria-label="讲解进度" data-progress></nav>

      <section class="rs-workspace">
        <section id="lesson-stage" class="rs-stage" data-stage aria-live="polite"></section>
        <aside class="rs-board" data-board aria-live="polite"></aside>
      </section>

      <footer class="rs-console">
        <button class="rs-nav-button" type="button" data-action="prev">← <span data-copy="prev">上一页</span></button>
        <span class="rs-page-count" data-page-count>第 1 页</span>
        <button class="rs-nav-button is-primary" type="button" data-action="next"><span data-next-label>下一页</span> →</button>
      </footer>

      <dialog class="rs-settings-dialog" data-settings-dialog>
        <form class="rs-settings-form" method="dialog" novalidate>
          <header class="rs-dialog-head">
            <div>
              <p class="rs-eyebrow" data-copy="parameters">题目参数</p>
              <h2 data-copy="settingsTitle">换一道题试一试</h2>
              <p data-copy="settingsLead">应用后会回到第1页，重新演示切分和重组。</p>
            </div>
            <button class="rs-icon-button" type="button" data-action="close-settings" aria-label="关闭">×</button>
          </header>

          <label class="rs-field">
            <span data-copy="areaLabel">长方形面积（正整数）</span>
            <div class="rs-input-with-unit">
              <input name="area" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" value="225" data-setting="area" />
              <span data-copy="squareMetres">平方米</span>
            </div>
          </label>
          <label class="rs-field">
            <span data-copy="factorLabel">长除以、宽乘以的同一个数（2～10）</span>
            <input name="factor" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" value="5" data-setting="factor" />
          </label>

          <section class="rs-method-note">
            <strong data-copy="methodTitle">怎样选一组适合小学课堂的数？</strong>
            <p data-copy="methodCopy">面积要能由同一个整数相乘得到，而且边长要能被变化数字整除。</p>
          </section>

          <p class="rs-dialog-error" data-settings-error role="alert" hidden></p>
          <div class="rs-dialog-actions">
            <button class="rs-dialog-button" type="button" data-action="cancel-settings" data-copy="cancel">取消</button>
            <button class="rs-dialog-button is-primary" type="button" data-action="apply-settings" data-copy="apply">应用并重新讲解</button>
          </div>
        </form>
      </dialog>
    </main>

    <script src="../../assets/lab-data.js?v=20260714-1"></script>
    <script src="../../assets/lab-models.js?v=20260714-1"></script>
    <script src="../../assets/lab-core.js"></script>
    <script src="lesson.js?v=20260714-2"></script>
  </body>
</html>
