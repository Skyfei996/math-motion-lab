      <dialog class="shelf-settings-dialog" data-settings-dialog>
        <form class="shelf-settings-form" method="dialog" novalidate>
          <header class="shelf-dialog-head">
            <div>
              <p class="shelf-eyebrow" data-copy="parameters">题目参数</p>
              <h2 data-copy="settingsTitle">编辑书架倍数问题</h2>
              <p data-copy="settingsLead">应用后会检查是否得到整数本答案，并从第1步重新讲解。</p>
            </div>
            <button class="shelf-icon-button" type="button" data-action="close-settings" aria-label="关闭">×</button>
          </header>

          <label class="shelf-field">
            <span data-copy="removedLabel">第一个书架取出</span>
            <span class="shelf-input-wrap">
              <input name="removedFromFirst" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" value="200" data-setting="removedFromFirst" />
              <span data-copy="booksUnit">本</span>
            </span>
          </label>
          <label class="shelf-field">
            <span data-copy="addedLabel">第二个书架放入</span>
            <span class="shelf-input-wrap">
              <input name="addedToSecond" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" value="40" data-setting="addedToSecond" />
              <span data-copy="booksUnit">本</span>
            </span>
          </label>
          <label class="shelf-field">
            <span data-copy="multipleLabel">变化后的倍数</span>
            <span class="shelf-input-wrap">
              <input name="multiple" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" value="3" data-setting="multiple" />
              <span data-copy="timesUnit">倍</span>
            </span>
          </label>

          <section class="shelf-validity-note">
            <strong data-copy="validityTitle">有效题目需要满足</strong>
            <ul>
              <li data-copy="validityPositive">取出、放入都是正整数，倍数不小于2</li>
              <li data-copy="validityWhole">变化后的相差本数能平均分成“倍数减1”份</li>
            </ul>
          </section>

          <p class="shelf-dialog-error" data-settings-error role="alert" hidden></p>
          <div class="shelf-dialog-actions">
            <button class="shelf-dialog-button" type="button" data-action="cancel-settings" data-copy="cancel">取消</button>
            <button class="shelf-dialog-button is-primary" type="button" data-action="apply-settings" data-copy="apply">应用并重新讲解</button>
          </div>
        </form>
