      function renderCatalog() {
        const categoryStrip = document.querySelector("[data-category-strip]");
        const catalogGrid = document.querySelector("[data-catalog-grid]");
        if (!categoryStrip || !catalogGrid) return;

        const preferences = MathLabCatalogPreferences.load();
        const hiddenIds = new Set(preferences.hiddenIds);
        const lessons = preferences.order
          .map((id) => MathLabData.catalog.find((lesson) => lesson.id === id))
          .filter((lesson) => lesson && !hiddenIds.has(lesson.id));
        const representedCategories = new Set(lessons.map((lesson) => lesson.category));
        const categories = ["all", ...MathLabData.categories.filter((category) => representedCategories.has(category))];
        if (!categories.includes(activeCategory)) activeCategory = "all";

        categoryStrip.replaceChildren();
        categories.forEach((category) => {
          const button = document.createElement("button");
          button.className = "category-pill";
          button.type = "button";
          button.dataset.category = category;
          button.setAttribute("aria-pressed", String(category === activeCategory));
          button.textContent =
            category === "all" ? MathLab.text("common.categoryAll") : MathLab.text(`categories.${category}`);
          button.addEventListener("click", () => {
            activeCategory = category;
            renderCatalog();
          });
          categoryStrip.append(button);
        });

        catalogGrid.replaceChildren();
        lessons
          .filter((lesson) => activeCategory === "all" || lesson.category === activeCategory)
          .forEach((lesson) => {
            const card = document.createElement("a");
            const title = MathLab.text(`lessons.${lesson.id}.title`);
            const titleId = `lesson-${lesson.id}-title`;
            const summaryId = `lesson-${lesson.id}-summary`;
            card.className = "experiment-card";
            card.href = lesson.href;
            card.setAttribute("aria-labelledby", titleId);
            card.setAttribute("aria-describedby", summaryId);

            const preview = document.createElement("div");
            preview.className = "experiment-preview";
            preview.innerHTML = previewSvg(lesson.preview);

            const body = document.createElement("div");
            body.className = "experiment-body";

            const meta = document.createElement("div");
            meta.className = "experiment-meta";

            const categoryChip = document.createElement("span");
            categoryChip.className = `meta-chip ${lesson.accent || ""}`.trim();
            categoryChip.textContent = MathLab.text(`categories.${lesson.category}`);

            const gradeChip = document.createElement("span");
            gradeChip.className = "meta-chip";
            gradeChip.textContent = MathLab.text(`lessons.${lesson.id}.grade`);

            const interactionChip = document.createElement("span");
            interactionChip.className = "meta-chip";
            interactionChip.textContent = MathLab.text(`lessons.${lesson.id}.interaction`);

            meta.append(categoryChip, gradeChip, interactionChip);

            const heading = document.createElement("h2");
            heading.id = titleId;
            heading.textContent = title;

            const summary = document.createElement("p");
            summary.id = summaryId;
            summary.textContent = MathLab.text(`lessons.${lesson.id}.summary`);

            body.append(meta, heading, summary);
            card.append(preview, body);
            catalogGrid.append(card);
          });
        let emptyMessage = document.querySelector("[data-catalog-empty]");
        if (!emptyMessage) {
          emptyMessage = document.createElement("p");
          emptyMessage.className = "catalog-empty";
          emptyMessage.dataset.catalogEmpty = "";
          catalogGrid.after(emptyMessage);
        }
        emptyMessage.hidden = catalogGrid.childElementCount > 0;
        emptyMessage.textContent = MathLab.text("home.catalogEmpty");
      }

      document.addEventListener("DOMContentLoaded", () => {
        MathLab.applyText();
        renderCatalog();
        MathLab.bindLanguageToggle(renderCatalog);
      });
    </script>
